<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CES Pool Plant 3D</title>
<style>
:root{--bg:#0e1b2b;--ln:#2a4666;--tx:#e1eaf3;--mt:#8fa6bd;--am:#e8b86a;--tl:#6cc4c0;--rd:#e27d7d;--gn:#6cc59a;--bl:#5b9bd5;color-scheme:dark}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;overflow:hidden}
#side{width:350px;overflow-y:auto;background:linear-gradient(180deg,#162b42,#0f2033);padding:12px;box-sizing:border-box;border-inline-end:1px solid var(--ln);scrollbar-width:thin;scrollbar-color:#2a4666 transparent}
#view{flex:1;position:relative;min-width:0}#view canvas{display:block;outline:none}
.hd{padding:4px 4px 8px}h1{font-size:16px;margin:0;color:var(--am);letter-spacing:.3px}small{color:var(--mt)}
details{background:#ffffff08;border:1px solid #ffffff10;border-radius:12px;margin:9px 0;overflow:hidden;transition:background .25s}
details[open]{background:#ffffff0d}
summary{cursor:pointer;padding:9px 12px;font-weight:600;color:var(--am);list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";margin-inline-start:auto;color:var(--mt);transition:transform .25s}
details[open] summary::after{transform:rotate(180deg)}
.in{padding:0 12px 12px;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.b{background:#ffffff0f;color:var(--tx);border:1px solid #ffffff18;border-radius:9px;padding:7px 9px;cursor:pointer;font:inherit;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.b:hover{background:#ffffff1c;transform:translateY(-1px)}.b:active{transform:none}
.b.a{background:linear-gradient(135deg,#e8b86a,#d9a04e);color:#13253a;border-color:transparent;font-weight:600}
.b.on{background:#6cc4c022;border-color:var(--tl);color:#c4efec}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
input,select,textarea{background:#0c192a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;font:inherit;width:100%;box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px #6cc4c022}
input[type=range]{padding:0;accent-color:var(--tl)}
label{display:block;margin-top:6px;color:var(--mt);font-size:12px}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx)}.ck input{width:auto}
.ttl{color:var(--am);font-weight:600;margin-bottom:6px}
#info,#sp,#lks{background:#0a1626aa;border-radius:10px;padding:9px;line-height:1.7;margin-top:8px}
.lk{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid #ffffff10;padding:3px 0}.lk .b{padding:1px 8px}
#sp ul{margin:6px 0 0;padding-inline-start:18px;color:var(--mt)}
table{width:100%;border-collapse:collapse;font-size:12px}td{padding:3px 4px;border-bottom:1px solid #ffffff0f}td:last-child{text-align:center;color:var(--am)}
#tb{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px);background:#10203299;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px;border-radius:14px;border:1px solid #ffffff16}
#tb .b{padding:6px 10px}
#hint{position:absolute;top:70px;left:50%;transform:translate(-50%,-6px);background:linear-gradient(135deg,#e8b86a,#d9a04e);color:#13253a;padding:6px 16px;border-radius:20px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 6px 20px #0006}
#hint.show{opacity:1;transform:translate(-50%,0)}
#lg{position:absolute;bottom:12px;left:12px;background:#10203299;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 11px;border-radius:12px;border:1px solid #ffffff16;font-size:11px;line-height:1.7}
#lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
#md{position:fixed;inset:0;background:#050d18bb;display:none;align-items:center;justify-content:center;z-index:9;backdrop-filter:blur(4px)}
#md>div{background:#13273d;padding:14px;border-radius:14px;width:min(680px,94vw);border:1px solid var(--ln)}
#cv{width:100%;height:auto;border-radius:8px;cursor:crosshair}
@media(max-width:800px){body{flex-direction:column-reverse}#side{width:100%;height:48%}#view{height:52%;flex:none}}
#joy,#joy2{position:absolute;bottom:26px;width:112px;height:112px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff2a;display:none;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}#joy{left:18px}#joy2{right:18px}
#wkbar{display:none;position:absolute;top:12px;left:12px;gap:6px;flex-wrap:wrap;background:#10203299;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px;border-radius:14px;border:1px solid #ffffff16}body.walk #wkbar{display:none}body.walk.ctl #wkbar{display:flex}body.walk #tb{display:none}body.walk #side{display:none}body.walk #view{position:fixed;inset:0;z-index:30;width:100vw;height:100vh;height:100dvh;flex:none}
#joy i,#joy2 i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#e8b86acc;box-shadow:0 4px 14px #0006;pointer-events:none}
body.walk #joy,body.walk #joy2{display:block}body.walk #lg{display:none}
#xh{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ffffffb0;box-shadow:0 0 0 2px #0005;display:none;pointer-events:none}
#hud{position:absolute;top:14px;right:14px;display:none;gap:8px;align-items:center;background:#10203299;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 12px;border-radius:14px;border:1px solid #ffffff16;font-variant-numeric:tabular-nums}
#hud i{font-style:normal;color:var(--tl);font-size:11px}
body.walk.ctl #xh{display:block}body.walk.ctl #hud{display:flex}
#joy,#joy2{opacity:.25;transition:opacity .35s}#joy.act,#joy2.act{opacity:.8}
#wkh{display:none;position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff22;background:#00000022;color:#fff;opacity:.28;font-size:18px;line-height:1;cursor:pointer;transition:opacity .2s;padding:0}
body.walk #wkh{display:block}#wkh:active,body.ctl #wkh{opacity:.85}body.walk.ctl #wkh{display:none}
#gyq,#gyc{display:none;position:absolute;top:10px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff22;background:#00000022;color:#fff;opacity:.28;font-size:16px;line-height:1;cursor:pointer;transition:opacity .2s,background .2s,border-color .2s;padding:0}
#gyq{right:10px}#gyc{right:52px}
body.walk #gyq{display:block}body.walk.gyon:not(.ctl) #gyc{display:block}body.walk.ctl #gyq,body.walk.ctl #gyc{display:none}
#gyq.on{opacity:.85;border-color:var(--tl);background:#6cc4c033}#gyq:active,#gyc:active{opacity:.95}
#tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 2px}#tabs .b{padding:9px;font-weight:600}
body.fm .po{display:none!important}body:not(.fm) .fo{display:none!important}
#fcalc{background:#0a1626aa;border-radius:10px;padding:9px;line-height:1.6;margin-top:6px;font-size:12px}
#fcalc h4{margin:9px 0 3px;color:var(--am);font-size:12px}#fcalc table{font-size:11.5px}.ok{color:#6cc59a}.bad{color:#f08a8a}
#plbox{position:relative}#plc{width:100%;height:250px;border-radius:10px;background:#0b1626;touch-action:none;display:block}
#plx{position:absolute;top:6px;right:6px;padding:2px 9px;opacity:.85}#pinfo{font-size:12px;line-height:1.6;margin-top:6px;background:#0a1626aa;border-radius:8px;padding:7px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}.g4 .b{padding:7px 2px;font-size:12px}
#secplan.full>.in{position:fixed;inset:0;z-index:45;background:#0f2033;overflow:auto;padding:10px;animation:none}#secplan.full #plc{height:52vh}
body.only3d #side{display:none}body.only3d #view{position:fixed;inset:0;z-index:30;width:100vw;height:100vh;height:100dvh;flex:none}
#tb{display:none;top:54px;left:10px;gap:4px;max-width:min(318px,calc(100% - 20px));padding:5px;border-radius:15px;align-items:center}
body.tbopen #tb{display:flex}body.walk #tb{display:none!important}
#tb .b{width:38px;height:38px;padding:0;font-size:0;display:flex;align-items:center;justify-content:center;border-radius:11px}
#tb .b::before{content:attr(data-i);font-size:17px;line-height:1}#fv.on::before{content:'📊'}
#tb .sep{width:1px;height:22px;background:#ffffff22;margin:0 3px}
#tbh{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;border:1px solid #ffffff26;background:#00000030;color:#fff;opacity:.32;font-size:16px;line-height:1;cursor:pointer;padding:0;transition:opacity .2s;z-index:3}
#tbh:active,body.tbopen #tbh{opacity:.9}body.walk #tbh{display:none}
#tt{position:absolute;transform:translateX(-50%);background:#0e1b2bf2;color:#e8eef6;border:1px solid #ffffff2a;padding:5px 11px;border-radius:9px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:6;box-shadow:0 6px 18px #0006}#tt.show{opacity:1}
#tb .b,#tbh,#wkh,#gyq,#gyc{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
</style></head><body>
<div id="side">
<div class="hd"><h1>CES Pool Plant 3D</h1><small>Eng. Hesham Mohamed — CES</small></div>
<div id="tabs"><button class="b on" id="tpool">🏊 Pool</button><button class="b" id="tfnt">⛲ Fountain</button></div>

<div class="r"><label>Depth<input id="D" type="number" value="1.5" step="0.1"></label><button class="b a" id="mk" style="margin-top:20px">Create</button><button class="b" id="dw" style="margin-top:20px">Free draw</button></div>
<div class="r2"><label>Type<select id="pty"><option value="skim">Skimmer</option><option value="over">Overflow</option></select></label><label>Gutter width (m)<input id="gw" type="number" step=".05" value=".3"></label></div>
<div class="r"><label>Skimmer<select id="fsk"></select></label><label>Return inlet<select id="frt"></select></label><label>Q/inlet (m³/h)<input id="qin" type="number" value="8" step="1"></label></div>
<div id="info"></div></div></details>
<details open class="fo"><summary>⛲ Fountain</summary><div class="in">
<div class="r"><label>Basins<input id="fnb" type="number" min="1" max="4" value="3"></label><label>Length (m)<input id="fL" type="number" step=".5" value="6"></label><label>Width (m)<input id="fW" type="number" step=".5" value="4"></label></div>
<div class="r"><label>Level step (m)<input id="fst" type="number" step=".05" value=".5"></label><label>Wall height (m)<input id="fdp" type="number" step=".05" value=".6"></label><label>Place in basin<select id="fnp"></select></label></div>
<div class="r2"><label>Nozzle model<select id="fnm"></select></label><label>Water look (all nozzles)<select id="fnlk"><option value="">— choose —</option><option value="natural">Natural (by model)</option><option value="clear">Crystal clear</option><option value="foam">Soft foam</option><option value="sparkle">Sparkling</option><option value="blue">Night LED — blue</option><option value="warm">Night LED — warm</option><option value="green">Night LED — green</option></select></label></div>
<div class="r2"><label>Jet height (catalog)<select id="fnh"></select></label><div id="fnq" style="font-size:12px;margin-top:22px"></div></div>
<label>Water amount<input type="range" id="fwa" min=".5" max="3" step=".1" value="1.6"></label>
<div class="g"><button class="b a" id="fnadd">+ Place nozzle</button><button class="b" id="fnclr">Clear nozzles</button></div></div></details>
<details open class="fo"><summary>🧮 Calculations</summary><div class="in"><div id="fcalc"></div></div></details>
<details open><summary>⚙️ Pump room</summary><div class="in">
<div class="r"><label>Pumps<span class="fo"> (nozzle)</span><input id="npu" type="number" min="1" max="6" value="2"></label><label>Standby<input id="nsb" type="number" min="0" max="5" value="0"></label><label>Isolation valve<select id="vt"><option value="ball">Ball</option><option value="gate">Gate</option></select></label></div>
<div class="r"><label class="po">Filters in parallel (0 = auto)<input id="nfl" type="number" min="0" max="6" value="0"></label><label>Room distance (m)<input id="rdx" type="number" min="2" step="0.5" value="9"></label><label>Plant room level (m)<input id="rm" type="number" step=".5" value="3.5"></label></div>
<div class="r2 fo"><label>Filtration pumps<input id="fpu" type="number" min="1" max="2" value="1"></label><label>Turnover (h)<input id="ftn" type="number" step=".5" min="1" value="4"></label></div>
<div class="g"><button class="b a" id="auto">⚡ Auto build + connect</button><button class="b" id="clr">🗑️ Clear equipment</button></div>
<label>Or pick equipment, then click the floor</label><div class="g" id="pal"></div></div></details>
<details id="secplan"><summary>📐 Plan &amp; distribution</summary><div class="in">
<div id="plbox"><canvas id="plc"></canvas><button class="b" id="plx" title="Full screen">⤢</button></div>
<div class="r"><label>View<select id="pvw"><option value="water">Water area</option><option value="room">Plant room</option></select></label><label>Snap (m)<select id="psn"><option>0.05</option><option>0.1</option><option selected>0.25</option><option>0.5</option><option>1</option></select></label><label>Tool<select id="ptl"></select></label></div>
<div id="pinfo"></div>
<div class="r"><label>X from corner (m)<input id="pxx" type="number" step=".05"></label><label>Y from corner (m)<input id="pyy" type="number" step=".05"></label><label>Step (m)<select id="pst"><option>0.05</option><option>0.1</option><option selected>0.25</option><option>0.5</option><option>1</option></select></label></div>
<div class="g4"><button class="b" id="pxm">◀ X−</button><button class="b" id="pxp">X+ ▶</button><button class="b" id="pym">▲ Y−</button><button class="b" id="pyp">▼ Y+</button></div>
<div class="g"><button class="b" id="pdel">🗑️ Delete selected</button><button class="b" id="pauto">↺ Fittings → auto</button></div>
<div class="ttl" style="margin-top:12px">Distribute (regular pattern)</div>
<div class="r2"><label>Target<select id="dtg"></select></label><label>Pattern<select id="dpt"><option value="lin">Linear row</option><option value="grid">Grid</option><option value="ring">Ring / circle</option><option value="per">Along outline</option></select></label></div>
<div class="r"><label>Count<input id="dn" type="number" min="1" value="5"></label><label>Spacing / radius (m)<input id="ds" type="number" step=".1" value="1"></label><label>Angle (°)<input id="da" type="number" value="0"></label></div>
<div class="r"><label>Rows<input id="drw" type="number" min="1" value="2"></label><label>Columns<input id="dcl" type="number" min="1" value="3"></label><label>Inset (m)<input id="din" type="number" step=".1" value=".5"></label></div>
<div class="r"><label>Center X (blank = middle)<input id="dx0" type="number" step=".1"></label><label>Center Y<input id="dy0" type="number" step=".1"></label><label class="ck" style="margin-top:20px"><input type="checkbox" id="drep"> Replace</label></div>
<div class="g"><button class="b" id="dprev">👁 Preview</button><button class="b a" id="dapp">Apply</button></div>
</div></details>
<details><summary>🔗 Piping network</summary><div class="in"><div id="lks"></div></div></details>
<details id="secsel" open><summary>🎛️ Selected</summary><div class="in"><div id="sp"></div></div></details>
<details><summary>🖥️ View</summary><div class="in"><label>Ground transparency<input id="go" type="range" min="0" max="100" value="55"></label></div></details>
<details><summary>📋 BOM</summary><div class="in"><div id="bom"></div><button class="b" id="cp" style="margin-top:8px;width:100%">Copy CSV</button></div></details>
</div>
<div id="view"><button id="tbh" title="Tools">☰</button><div id="tb"><button data-i="↩︎" class="b" id="ud" title="Ctrl+Z">↩︎ Undo</button><button data-i="✋" class="b on" id="mv" title="Drag only moves the selected item">✋ Move</button><button data-i="🔗" title="Link pipes" class="b" id="lnk">🔗 Link</button><i class="sep"></i><button data-i="🏷️" title="Labels on/off" class="b on" id="lb">🏷️ Labels</button><button data-i="💧" title="Water flow animation" class="b on" id="fl">💧 Flow</button><i class="sep"></i><button data-i="⬇️" title="Top view" class="b" id="tp">⬇️ Top</button><button data-i="🎯" title="Reset camera" class="b" id="rc">🎯 Reset</button><button data-i="🏭" title="Pump room view" class="b" id="pr">🏭 Pump room</button><button data-i="🚶" title="Walk inside the room" class="b" id="wk">🚶 Walk</button><button data-i="🖼️" class="b" id="fv" title="Show only the 3D view / bring the panels back">🖼️ 3D only</button></div><div id="hint"></div><button id="wkh" title="Controls">⋯</button><button id="gyq" title="Gyro">🧭</button><button id="gyc" title="Center view">⊙</button><div id="xh"></div><div id="hud"><b id="hdg">N 000°</b><i id="hgy"></i></div><div id="joy"><i></i></div><div id="joy2"><i></i></div><div id="wkbar"><button class="b" id="tl">⟲ 45°</button><button class="b" id="tr">⟳ 45°</button><button class="b" id="gy">🧭 Gyro</button><button class="b" id="gc">⊙ Center</button><button class="b" id="gs">⚙ 1×</button><button class="b" id="ls">👆 1×</button><button class="b" id="sx">✖ Exit</button></div><div id="lg"><i style="background:#5b9bd5"></i>Suction<br><i style="background:#e27d7d"></i>Discharge<br><i style="background:#6cc59a"></i>Filtered water / Return<br><i style="background:#e8b86a"></i>Dosing</div></div>
<div id="md"><div><canvas id="cv" width="640" height="420"></canvas><div class="g"><button class="b" id="un">Undo</button><button class="b" id="cl">Clear</button><button class="b a" id="ap">Apply</button><button class="b" id="cx">Close</button></div><small>Click to add points (0.5 m grid) — at least 3 points</small></div></div>

$('cp').onclick=()=>{const t=window.ROWS.map(r=>`"${r[0]}",${r[1]}`).join('\n');try{navigator.clipboard.writeText(t)}catch(e){}};

let dp=[];const cv=$('cv'),cx=cv.getContext('2d'),SC=24;
function dcv(){cx.fillStyle='#0e1b2b';cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle='#1f3a56';cx.lineWidth=1;cx.beginPath();for(let x=0;x<=cv.width;x+=SC){cx.moveTo(x,0);cx.lineTo(x,cv.height)}for(let y=0;y<=cv.height;y+=SC){cx.moveTo(0,y);cx.lineTo(cv.width,y)}cx.stroke();
 if(!dp.length)return;cx.strokeStyle='#e8b86a';cx.lineWidth=2;cx.fillStyle='#e8b86a33';cx.beginPath();dp.forEach((p,i)=>i?cx.lineTo(p[0]*SC,p[1]*SC):cx.moveTo(p[0]*SC,p[1]*SC));if(dp.length>2)cx.closePath();cx.fill();cx.stroke();cx.fillStyle='#fff';dp.forEach(p=>cx.fillRect(p[0]*SC-3,p[1]*SC-3,6,6))}
cv.onclick=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;dp.push([Math.round((e.clientX-r.left)*k/SC*2)/2,Math.round((e.clientY-r.top)*k/SC*2)/2]);dcv()};
$('dw').onclick=()=>{dp=[];dcv();$('md').style.display='flex'};
$('un').onclick=()=>{dp.pop();dcv()};$('cl').onclick=()=>{dp=[];dcv()};$('cx').onclick=()=>$('md').style.display='none';
$('ap').onclick=()=>{if(dp.length<3)return;depth=+$('D').value||1.5;pts=dp.map(p=>p.slice());$('md').style.display='none';buildPool();items.forEach(mk);fitCam()};

loadState('pool');
SK.forEach((m,i)=>$('fsk').add(new Option(m.c,i)));RT.forEach((m,i)=>$('frt').add(new Option(m.c,i)));
syncUI();planFill();
['fsk','frt','qin','pty','gw','rm','vt','npu','nsb','nfl','rdx','fpu'].forEach(id=>$(id).onchange=()=>{FM={sk:+$('fsk').value,rt:+$('frt').value,qin:+$('qin').value||8,ty:$('pty').value,gw:+$('gw').value||.3,rm:+$('rm').value||3.5,vt:$('vt').value,np:+$('npu').value||2,sb:+$('nsb').value||0,nf:+$('nfl').value||0,rd:+$('rdx').value||9,fp:+$('fpu').value||1};rebuild()});
showSel();buildPool();fitCam(false);rs();
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.1);
 if(flowOn)for(const f of flows){f.t=(f.t+dt*1.2/f.L)%1;let d=f.t*f.L,i=0;while(i<f.ls.length-1&&d>f.ls[i]){d-=f.ls[i];i++}f.o.position.lerpVectors(f.P[i],f.P[i+1],f.ls[i]?Math.min(1,d/f.ls[i]):0)}
 WTX.offset.x+=dt*.015;WTX.offset.y+=dt*.01;WFX.offset.y-=dt*.9;WFU.offset.y+=dt*1.3;if(MODE==='fountain')jetsStep(clk.elapsedTime);
 if(camA){const k=Math.min(1,(performance.now()-camA.s)/camA.d),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;C.position.lerpVectors(camA.p0,camA.p1,e);O.target.lerpVectors(camA.t0,camA.t1,e);if(k>=1)camA=null}
 if(drag&&tgt){const k=1-Math.pow(1e-4,dt),nx=drag.g.position.x+(tgt.x-drag.g.position.x)*k,nz=drag.g.position.z+(tgt.z-drag.g.position.z)*k;drag.g.position.x=nx;drag.g.position.z=nz;dmx.forEach(o=>{o.g.position.x=nx;o.g.position.z=nz});BH.setFromObject(drag.g)}
 if(walkOn)walkStep(dt);else O.update();R.render(S,C)})();
