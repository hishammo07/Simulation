.hd{padding:4px 4px 8px}h1{font-size:16px;margin:0;color:var(--am);letter-spacing:.3px}small{color:var(--mt)}

details[open]{background:#ffffff0d}
summary{cursor:pointer;padding:9px 12px;font-weight:600;color:var(--am);list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";margin-inline-start:auto;color:var(--mt);transition:transform .25s}
details[open] summary::after{transform:rotate(180deg)}
.in{padding:0 12px 12px;animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.b{background:#ffffff0f;color:var(--tx);border:1px solid #ffffff18;border-radius:9px;padding:7px 9px;cursor:pointer;font:inherit;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.b:hover{background:#ffffff1c;transform:translateY(-1px)}.b:active{transform:none}
.b.a{background:linear-gradient(135deg,#e8b86a,#d9a04e);color:#13253a;border-color:transparent;font-weight:600}
.b.on{background:#6cc4c022;border-color:var(--tl);color:#c4efec}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
input,select,textarea{background:#0c192a;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px;font:inherit;width:100%;box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tl);box-shadow:0 0 0 3px #6cc4c022}
input[type=range]{padding:0;accent-color:var(--tl)}
label{display:block;margin-top:6px;color:var(--mt);font-size:12px}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx)}.ck input{width:auto}
.ttl{color:var(--am);font-weight:600;margin-bottom:6px}
#info,#sp,#lks{background:#0a1626aa;border-radius:10px;padding:9px;line-height:1.7;margin-top:8px}
.lk{display:flex;justify-content:space-between;align-items:center;gap:6px;border-bottom:1px solid #ffffff10;padding:3px 0}.lk .b{padding:1px 8px}
#sp ul{margin:6px 0 0;padding-inline-start:18px;color:var(--mt)}
table{width:100%;border-collapse:collapse;font-size:12px}td{padding:3px 4px;border-bottom:1px solid #ffffff0f}td:last-child{text-align:center;color:var(--am)}
#tb{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 24px);background:#10203299;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px;border-radius:14px;border:1px solid #ffffff16}
#tb .b{padding:6px 10px}
#hint{position:absolute;top:70px;left:50%;transform:translate(-50%,-6px);background:linear-gradient(135deg,#e8b86a,#d9a04e);color:#13253a;padding:6px 16px;border-radius:20px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 6px 20px #0006}
#hint.show{opacity:1;transform:translate(-50%,0)}
#lg{position:absolute;bottom:12px;left:12px;background:#10203299;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:8px 11px;border-radius:12px;border:1px solid #ffffff16;font-size:11px;line-height:1.7}
#lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}

#md>div{background:#13273d;padding:14px;border-radius:14px;width:min(680px,94vw);border:1px solid var(--ln)}
#cv{width:100%;height:auto;border-radius:8px;cursor:crosshair}
